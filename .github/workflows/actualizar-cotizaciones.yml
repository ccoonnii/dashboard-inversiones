
name: Actualizar cotizaciones

on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * 1-5"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consultar y guardar SPY
        run: |
          python -m pip install yfinance
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          import yfinance as yf

          archivo = "cotizaciones.json"
          datos = {}

          try:
              with open(archivo, "r", encoding="utf-8") as f:
                  datos = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              pass

          historial = yf.Ticker("SPY.BA").history(period="5d")
          if historial.empty or historial["Close"].dropna().empty:
              raise RuntimeError("Yahoo Finance no devolvió precios para SPY.BA")

          precio_ars = float(historial["Close"].dropna().iloc[-1])

          cambio = yf.Ticker("ARS=X").history(period="5d")
          if cambio.empty or cambio["Close"].dropna().empty:
              raise RuntimeError("No se pudo obtener el tipo de cambio USD/ARS")

          ars_por_usd = float(cambio["Close"].dropna().iloc[-1])
          if ars_por_usd <= 0:
              raise RuntimeError("Tipo de cambio no válido")

          precio_usd = precio_ars / ars_por_usd

          datos["SPY"] = {
              "precio": round(precio_usd, 4),
              "precio_ars": round(precio_ars, 2),
              "tipo_cambio_ars_por_usd": round(ars_por_usd, 2),
              "actualizado": datetime.now(timezone.utc).isoformat()
          }

          with open(archivo, "w", encoding="utf-8") as f:
              json.dump(datos, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print(f"SPY.BA: ARS {precio_ars:.2f}")
          print(f"Tipo de cambio: {ars_por_usd:.2f} ARS/USD")
          print(f"Precio convertido: USD {precio_usd:.4f}")
          PY

      - name: Consultar Bitcoin y Ethereum
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          archivo = "cotizaciones.json"

          try:
              with open(archivo, "r", encoding="utf-8") as f:
                  datos = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              datos = {}

          def consultar(symbol):
              url = (
                  "https://api.binance.com/api/v3/ticker/24hr"
                  f"?symbol={symbol}"
              )
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "dashboard-inversiones"}
              )
              with urllib.request.urlopen(req, timeout=20) as respuesta:
                  import json as js
                  return js.loads(respuesta.read().decode("utf-8"))

          actualizado = datetime.now(timezone.utc).isoformat()

          for symbol in ("BTCUSDT", "ETHUSDT"):
              try:
                  cotizacion = consultar(symbol)
                  datos[symbol] = {
                      "precio": float(cotizacion["lastPrice"]),
                      "variacion_24h_pct": float(
                          cotizacion["priceChangePercent"]
                      ),
                      "actualizado": actualizado
                  }
                  print(
                      f"{symbol}: {datos[symbol]['precio']} USDT "
                      f"({datos[symbol]['variacion_24h_pct']}% en 24 h)"
                  )
              except Exception as error:
                  print(f"No se pudo actualizar {symbol}: {error}")
                  if symbol not in datos:
                      datos[symbol] = {
                          "error": "Cotización todavía no disponible"
                      }

          with open(archivo, "w", encoding="utf-8") as f:
              json.dump(datos, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cotizaciones.json
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos para guardar."
          else
            git commit -m "Actualizar cotizaciones de activos"
            git push
          fi
