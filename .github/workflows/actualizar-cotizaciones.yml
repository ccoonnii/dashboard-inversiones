
name: Actualizar cotizaciones

on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * 1-5"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consultar y guardar SPY
        run: |
          python -m pip install yfinance
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          import yfinance as yf

          archivo = "cotizaciones.json"
          datos = {}

          try:
              with open(archivo, "r", encoding="utf-8") as f:
                  datos = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              pass

          historial = yf.Ticker("SPY.BA").history(period="5d")
          if historial.empty:
              raise RuntimeError("Yahoo Finance no devolvió precios para SPY")

          
precio_ars = float(historial["Close"].dropna().iloc[-1])

cambio = yf.Ticker("ARS=X").history(period="5d")
if cambio.empty:
    raise RuntimeError("No se pudo obtener el tipo de cambio USD/ARS")

ars_por_usd = float(cambio["Close"].dropna().iloc[-1])
if ars_por_usd <= 0:
    raise RuntimeError("Tipo de cambio no válido")

precio_usd = precio_ars / ars_por_usd

datos["SPY"] = {
    "precio": round(precio_usd, 4),
    "precio_ars": round(precio_ars, 2),
    "tipo_cambio_ars_por_usd": round(ars_por_usd, 2),
    "actualizado": datetime.now(timezone.utc).isoformat()
}


          with open(archivo, "w", encoding="utf-8") as f:
              json.dump(datos, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print(f"SPY guardado: USD {precio:.4f}")
          PY

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cotizaciones.json
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos para guardar."
          else
            git commit -m "Actualizar cotización de SPY"
            git push
          fi
