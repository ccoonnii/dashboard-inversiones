
name: Actualizar cotizaciones

on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: actualizar-cotizaciones
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar SPY
        run: |
          python -m pip install yfinance
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          import yfinance as yf

          archivo = "cotizaciones.json"
          try:
              with open(archivo, encoding="utf-8") as f:
                  datos = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              datos = {}

          try:
              h = yf.Ticker("SPY.BA").history(period="5d")
              fx = yf.Ticker("ARS=X").history(period="5d")

              if not h.empty and not fx.empty:
                  ars = float(h["Close"].dropna().iloc[-1])
                  cambio = float(fx["Close"].dropna().iloc[-1])

                  if ars > 0 and cambio > 0:
                      datos["SPY"] = {
                          "precio": round(ars / cambio, 4),
                          "precio_ars": round(ars, 2),
                          "tipo_cambio_ars_por_usd": round(cambio, 2),
                          "actualizado": datetime.now(timezone.utc).isoformat()
                      }
                      print("SPY actualizado")
                  else:
                      print("Precio no válido; se conserva el anterior")
              else:
                  print("Sin datos nuevos de SPY; se conserva el anterior")
          except Exception as e:
              print(f"Error SPY; se conserva el anterior: {e}")

          with open(archivo, "w", encoding="utf-8") as f:
              json.dump(datos, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY

      - name: Actualizar CEDEARs desde Data912
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          archivo = "cotizaciones.json"
          with open(archivo, encoding="utf-8") as f:
              datos = json.load(f)

          url = "https://data912.com/live/arg_cedears"
          req = urllib.request.Request(
              url, headers={"User-Agent": "dashboard-inversiones"}
          )

          try:
              with urllib.request.urlopen(req, timeout=25) as r:
                  filas = json.loads(r.read().decode("utf-8"))

              if isinstance(filas, dict):
                  filas = filas.get("data", filas.get("results", []))

              encontrados = {}

              for fila in filas:
                  if not isinstance(fila, dict):
                      continue

                  simbolo = str(
                      fila.get("symbol", fila.get("ticker", ""))
                  ).upper().strip()

                  if simbolo in ("XPD", "EWZD", "NUD"):
                      precio = fila.get(
                          "c", fila.get("last", fila.get("price"))
                      )

                      if precio is not None and float(precio) > 0:
                          encontrados[simbolo] = {
                              "precio": float(precio),
                              "precio_ars": float(precio),
                              "fuente": "Data912",
                              "actualizado": datetime.now(
                                  timezone.utc
                              ).isoformat()
                          }

              for simbolo in ("XPD", "EWZD", "NUD"):
                  if simbolo in encontrados:
                      datos[simbolo] = encontrados[simbolo]
                      print(f"{simbolo}: actualizado")
                  else:
                      print(f"{simbolo}: sin precio nuevo; se conserva el anterior")

          except Exception as e:
              print(f"Error Data912; se conservan los precios anteriores: {e}")

          with open(archivo, "w", encoding="utf-8") as f:
              json.dump(datos, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY

      - name: Actualizar Bitcoin y Ethereum desde CoinGecko
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          archivo = "cotizaciones.json"
          with open(archivo, encoding="utf-8") as f:
              datos = json.load(f)

          url = (
              "https://api.coingecko.com/api/v3/simple/price"
              "?ids=bitcoin,ethereum&vs_currencies=usd"
              "&include_24hr_change=true"
          )

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "dashboard-inversiones"}
          )

          with urllib.request.urlopen(req, timeout=25) as r:
              cotizaciones = json.loads(r.read().decode("utf-8"))

          ahora = datetime.now(timezone.utc).isoformat()

          equivalencias = {
              "BTCUSDT": "bitcoin",
              "ETHUSDT": "ethereum"
          }

          for simbolo, id_moneda in equivalencias.items():
              moneda = cotizaciones[id_moneda]
              datos[simbolo] = {
                  "precio": float(moneda["usd"]),
                  "variacion_24h_pct": float(
                      moneda.get("usd_24h_change", 0)
                  ),
                  "fuente": "CoinGecko",
                  "actualizado": ahora
              }
              print(f"{simbolo}: actualizado desde CoinGecko")

          with open(archivo, "w", encoding="utf-8") as f:
              json.dump(datos, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cotizaciones.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos para guardar."
            exit 0
          fi

          git commit -m "Actualizar cotizaciones de la cartera"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
