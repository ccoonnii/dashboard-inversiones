
name: Actualizar cotizaciones

on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * 1-5"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mostrar estado inicial
        run: |
          echo "La tarea automática está configurada."
          echo "Todavía falta conectar las cotizaciones reales."
