
name: Actualizar cotizaciones

on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * 1-5"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar SPY
        run: |
          python -m pip install yfinance
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          import yfinance as yf

          archivo = "cotizaciones.json"
          try:
              with open(archivo, encoding="utf-8") as f:
                  datos = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              datos = {}

          h = yf.Ticker("SPY.BA").history(period="5d")
          if not h.empty and not h["Close"].dropna().empty:
              ars = float(h["Close"].dropna().iloc[-1])
              fx = yf.Ticker("ARS=X").history(period="5d")
              if not fx.empty and not fx["Close"].dropna().empty:
                  cambio = float(fx["Close"].dropna().iloc[-1])
                  if cambio > 0:
                      datos["SPY"] = {
                          "precio": round(ars / cambio, 4),
                          "precio_ars": round(ars, 2),
                          "tipo_cambio_ars_por_usd": round(cambio, 2),
                          "actualizado": datetime.now(timezone.utc).isoformat()
                      }
                      print("SPY actualizado")
                  else:
                      print("Tipo de cambio no válido; se conserva SPY anterior")
              else:
                  print("Sin tipo de cambio; se conserva SPY anterior")
          else:
              print("Sin precio SPY; se conserva el anterior")

          with open(archivo, "w", encoding="utf-8") as f:
              json.dump(datos, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY

      - name: Actualizar CEDEARs desde Data912
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          archivo = "cotizaciones.json"
          try:
              with open(archivo, encoding="utf-8") as f:
                  datos = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              datos = {}

          url = "https://data912.com/live/arg_cedears"
          req = urllib.request.Request(
              url, headers={"User-Agent": "dashboard-inversiones"}
          )

          try:
              with urllib.request.urlopen(req, timeout=25) as r:
                  filas = json.loads(r.read().decode("utf-8"))

              if isinstance(filas, dict):
                  filas = filas.get("data", filas.get("results", []))

              encontrados = {}
              for fila in filas:
                  if not isinstance(fila, dict):
                      continue
                  simbolo = str(
                      fila.get("symbol", fila.get("ticker", ""))
                  ).upper().strip()
                  if simbolo in ("XPD", "EWZD", "NUD"):
                      precio = fila.get("c", fila.get("last", fila.get("price")))
                      if precio is not None:
                          precio = float(precio)
                          if precio > 0:
                              encontrados[simbolo] = {
                                  "precio": precio,
                                  "precio_ars": precio,
                                  "fuente": "Data912",
                                  "actualizado": datetime.now(
                                      timezone.utc
                                  ).isoformat()
                              }

              for simbolo in ("XPD", "EWZD", "NUD"):
                  if simbolo in encontrados:
                      datos[simbolo] = encontrados[simbolo]
                      print(f"{simbolo}: actualizado")
                  else:
                      print(
                          f"{simbolo}: no encontrado; "
                          "se conserva el dato anterior si existe"
                      )
          except Exception as e:
              print(f"Error consultando Data912: {e}")
              print("Se conservan los datos anteriores de los CEDEARs")

          with open(archivo, "w", encoding="utf-8") as f:
              json.dump(datos, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY

      - name: Actualizar Bitcoin y Ethereum
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          archivo = "cotizaciones.json"
          try:
              with open(archivo, encoding="utf-8") as f:
                  datos = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              datos = {}

          for simbolo in ("BTCUSDT", "ETHUSDT"):
              url = (
                  "https://api.binance.com/api/v3/ticker/24hr"
                  f"?symbol={simbolo}"
              )
              try:
                  req = urllib.request.Request(
                      url, headers={"User-Agent": "dashboard-inversiones"}
                  )
                  with urllib.request.urlopen(req, timeout=20) as r:
                      cot = json.loads(r.read().decode("utf-8"))

                  datos[simbolo] = {
                      "precio": float(cot["lastPrice"]),
                      "variacion_24h_pct": float(cot["priceChangePercent"]),
                      "actualizado": datetime.now(timezone.utc).isoformat()
                  }
                  print(f"{simbolo}: actualizado")
              except Exception as e:
                  print(f"{simbolo}: error; se conserva el dato anterior: {e}")

          with open(archivo, "w", encoding="utf-8") as f:
              json.dump(datos, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY

      
      - name: Guardar cambios en GitHub
        run: |
          git pull --rebase origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cotizaciones.json
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos para guardar."
          else
            git commit -m "Actualizar cotizaciones de la cartera"
            git push origin main
          fi

