
name: Actualizar cotizaciones

on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * 1-5"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consultar y guardar SPY
        run: |
          python -m pip install yfinance
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          import yfinance as yf

          archivo = "cotizaciones.json"
          datos = {}

          try:
              with open(archivo, "r", encoding="utf-8") as f:
                  datos = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              pass

          historial = yf.Ticker("SPY").history(period="5d")
          if historial.empty:
              raise RuntimeError("Yahoo Finance no devolvió precios para SPY")

          precio = float(historial["Close"].dropna().iloc[-1])
          datos["SPY"] = {
              "precio": round(precio, 4),
              "actualizado": datetime.now(timezone.utc).isoformat()
          }

          with open(archivo, "w", encoding="utf-8") as f:
              json.dump(datos, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print(f"SPY guardado: USD {precio:.4f}")
          PY

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cotizaciones.json
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos para guardar."
          else
            git commit -m "Actualizar cotización de SPY"
            git push
          fi
